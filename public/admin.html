<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI工具后台</title>
  <style>
    :root { --bg:#f6f7f9; --panel:#fff; --text:#172033; --muted:#667085; --line:#d8dde7; --accent:#1f6feb; --danger:#c2410c; --ok:#15803d; --warn:#b45309; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Microsoft YaHei",system-ui,sans-serif; }
    header { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.92); border-bottom:1px solid var(--line); backdrop-filter:blur(12px); }
    .bar { width:min(1280px,calc(100% - 28px)); margin:0 auto; min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1 { margin:0; font-size:20px; }
    .sub { color:var(--muted); font-size:12px; margin-top:3px; }
    button, input, select, textarea { font:inherit; }
    button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 12px; cursor:pointer; color:var(--text); min-height:40px; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; box-shadow:0 0 0 4px rgba(31,111,235,.12); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.danger { color:var(--danger); }
    .top-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .tabs { width:min(1280px,calc(100% - 28px)); margin:12px auto 0; display:flex; gap:8px; }
    .tab { border-color:var(--line); background:#fff; }
    .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .sr-only { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    main { width:min(1280px,calc(100% - 28px)); margin:18px auto 40px; display:grid; grid-template-columns:260px 1fr; gap:16px; }
    main[hidden] { display:none; }
    .dashboard { width:min(1280px,calc(100% - 28px)); margin:18px auto 40px; display:grid; gap:16px; }
    .dashboard[hidden] { display:none; }
    .auth-panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
    .auth-panel label { min-width:min(420px,100%); flex:1; }
    .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .stat-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
    .stat-label { color:var(--muted); font-size:12px; }
    .stat-value { margin-top:5px; font-size:28px; font-weight:800; }
    .dash-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
    .dash-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .dash-card.wide { grid-column:1 / -1; }
    .dash-card h2 { margin:0; padding:14px; border-bottom:1px solid var(--line); font-size:16px; }
    .rank-list { display:grid; gap:0; }
    .rank-row { display:grid; grid-template-columns:34px 1fr auto; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); align-items:center; }
    .rank-row:last-child { border-bottom:none; }
    .rank-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank-count { color:var(--accent); font-weight:800; }
    .funnel { padding:14px; display:grid; gap:12px; }
    .funnel-row { display:grid; grid-template-columns:130px 1fr 84px 84px; gap:12px; align-items:center; }
    .funnel-label { font-weight:700; }
    .funnel-note { color:var(--muted); font-size:12px; margin-top:3px; }
    .funnel-bar { height:12px; border-radius:999px; background:#eef2f7; overflow:hidden; }
    .funnel-fill { height:100%; border-radius:999px; background:var(--accent); min-width:2px; }
    .funnel-value { font-weight:800; text-align:right; }
    .funnel-rate { color:var(--muted); text-align:right; font-size:12px; }
    .token-note { color:var(--muted); font-size:12px; line-height:1.5; }
    aside, section { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
    aside { align-self:start; position:sticky; top:82px; padding:12px; }
    .cat { width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; text-align:left; }
    .cat.active { border-color:var(--accent); color:var(--accent); }
    .panel-head { padding:14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .panel-tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .tool-search { min-width:220px; }
    .tools { padding:14px; display:grid; gap:10px; }
    .tool { border:1px solid var(--line); border-radius:10px; padding:12px; display:grid; grid-template-columns:1fr auto; gap:12px; background:#fff; }
    .tool h3 { margin:0 0 6px; font-size:16px; }
    .tool p { margin:0; color:var(--muted); line-height:1.5; font-size:13px; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .tag { border-radius:999px; background:#eef2f7; color:#475467; padding:3px 7px; font-size:12px; }
    .empty { color:var(--muted); text-align:center; padding:28px 10px; border:1px dashed var(--line); border-radius:10px; background:#fafafa; }
    .validation { margin:12px 0 0; border:1px solid var(--line); border-radius:10px; padding:10px; background:#fff; font-size:12px; line-height:1.55; color:var(--muted); }
    .validation.ok { border-color:rgba(21,128,61,.28); background:rgba(21,128,61,.06); color:var(--ok); }
    .validation.warn { border-color:rgba(180,83,9,.28); background:rgba(180,83,9,.06); color:#7c2d12; }
    .validation strong { color:var(--text); }
    .validation ul { margin:6px 0 0 18px; padding:0; }
    dialog { border:1px solid var(--line); border-radius:12px; width:min(760px,calc(100% - 24px)); padding:0; box-shadow:0 20px 60px rgba(15,23,42,.18); }
    dialog::backdrop { background:rgba(15,23,42,.4); }
    .modal-body { padding:14px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:12px; }
    input, select, textarea { border:1px solid var(--line); border-radius:8px; padding:9px 10px; color:var(--text); background:#fff; }
    textarea { min-height:92px; resize:vertical; }
    .full { grid-column:1 / -1; }
    .modal-actions { padding:14px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
    .notice { margin:0 0 12px; color:var(--muted); font-size:13px; line-height:1.6; }
    @media (max-width:800px) { .bar { align-items:flex-start; flex-direction:column; padding:12px 0; } .top-actions { justify-content:flex-start; } main { grid-template-columns:1fr; } aside { position:static; } .panel-head { align-items:flex-start; flex-direction:column; } .panel-tools,.tool-search { width:100%; } .modal-body { grid-template-columns:1fr; } .stat-grid,.dash-grid { grid-template-columns:1fr; } .auth-panel { align-items:stretch; } .funnel-row { grid-template-columns:1fr; gap:6px; } .funnel-value,.funnel-rate { text-align:left; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <h1>AI工具后台</h1>
        <div class="sub">编辑工具数据，导出 JSON 后用同步脚本写回首页。</div>
      </div>
      <div class="top-actions">
        <button id="validateBtn" type="button">校验数据</button>
        <button id="importBtn" type="button">导入 JSON</button>
        <button class="primary" id="exportBtn" type="button">导出 JSON</button>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="后台视图">
      <button class="tab active" id="toolsTab" type="button" role="tab" aria-selected="true" onclick="switchAdminView('tools')">工具数据</button>
      <button class="tab" id="dashboardTab" type="button" role="tab" aria-selected="false" onclick="switchAdminView('dashboard')">数据看板</button>
    </div>
  </header>

  <main id="toolsView">
    <aside>
      <p class="notice">安全策略：后台不直接写线上数据，避免未授权修改。修改后导出 `tools.json`，覆盖仓库里的 `data/tools.json`，再运行同步和发布。</p>
      <button class="primary" id="addCategoryBtn" type="button" style="width:100%;margin-bottom:10px">新增分类</button>
      <div id="categoryList"></div>
      <div id="validationBox" class="validation" role="status" aria-live="polite"></div>
    </aside>
    <section>
      <div class="panel-head">
        <div>
          <strong id="categoryTitle">工具列表</strong>
          <div class="sub" id="categoryMeta"></div>
        </div>
        <div class="panel-tools">
          <label class="sr-only" for="toolSearch">搜索当前分类工具</label>
          <input class="tool-search" id="toolSearch" aria-label="搜索当前分类工具" placeholder="搜索当前分类工具">
          <button class="primary" id="addToolBtn" type="button">新增工具</button>
        </div>
      </div>
      <div class="tools" id="toolList"></div>
    </section>
  </main>

  <div class="dashboard" id="dashboardView" hidden>
    <div class="auth-panel">
      <label>ADMIN_TOKEN
        <input id="adminToken" type="password" autocomplete="off" placeholder="输入 Cloudflare ADMIN_TOKEN">
      </label>
      <button class="primary" id="loadStatsBtn" type="button">加载数据</button>
      <button id="clearStatsTokenBtn" type="button">清除 token</button>
      <div class="token-note">Token 只保存在当前浏览器 sessionStorage，不写入工具数据 JSON。</div>
    </div>
    <div class="stat-grid" id="statGrid"></div>
    <div class="dash-grid">
      <section class="dash-card wide"><h2>转化漏斗</h2><div class="funnel" id="funnelList"></div></section>
      <section class="dash-card"><h2>事件类型</h2><div class="rank-list" id="eventTypeList"></div></section>
      <section class="dash-card"><h2>热门搜索词</h2><div class="rank-list" id="searchTermList"></div></section>
      <section class="dash-card"><h2>最多被收藏工具</h2><div class="rank-list" id="favoriteToolList"></div></section>
      <section class="dash-card"><h2>工具卡点击排行</h2><div class="rank-list" id="toolClickList"></div></section>
      <section class="dash-card"><h2>最多被问 AI 的工具</h2><div class="rank-list" id="askToolList"></div></section>
      <section class="dash-card"><h2>官网点击排行</h2><div class="rank-list" id="officialClickList"></div></section>
      <section class="dash-card"><h2>最近事件</h2><div class="rank-list" id="recentEventList"></div></section>
    </div>
  </div>

  <input type="file" id="fileInput" accept="application/json" hidden>

  <dialog id="toolDialog">
    <form method="dialog">
      <div class="panel-head"><strong id="toolDialogTitle">工具</strong><button value="cancel" aria-label="关闭工具编辑弹窗">关闭</button></div>
      <div class="modal-body">
        <label>名称<input id="toolName"></label>
        <label>分类<select id="toolCategory"></select></label>
        <label class="full">提问语句<input id="toolQuestion"></label>
        <label class="full">描述<textarea id="toolDesc"></textarea></label>
        <label>官网<input id="toolUrl"></label>
        <label>价格<input id="toolPrice" placeholder="免费 / 免费+付费 / 付费"></label>
        <label>适合人群<input id="toolAudience"></label>
        <label>标签，逗号分隔<input id="toolTags"></label>
        <label class="full">筛选项，逗号分隔<input id="toolFilters" placeholder="免费,国内直连,适合学生"></label>
      </div>
      <div class="modal-actions">
        <button class="danger" id="deleteToolBtn" type="button">删除</button>
        <button class="primary" id="saveToolBtn" type="button">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="categoryDialog">
    <form method="dialog">
      <div class="panel-head"><strong>分类</strong><button value="cancel" aria-label="关闭分类编辑弹窗">关闭</button></div>
      <div class="modal-body">
        <label>图标<input id="catIcon"></label>
        <label>名称<input id="catName"></label>
        <label class="full">背景色<input id="catBg"></label>
      </div>
      <div class="modal-actions">
        <button class="danger" id="deleteCategoryBtn" type="button">删除</button>
        <button class="primary" id="saveCategoryBtn" type="button">保存</button>
      </div>
    </form>
  </dialog>

  <script>
    let data = { version: "", categories: [] };
    let activeCategory = 0;
    let editingTool = null;
    let editingCategory = null;
    let toolSearch = "";
    let statsData = null;

    const $ = (id) => document.getElementById(id);
    const splitList = (value) => value.split(",").map(x => x.trim()).filter(Boolean);
    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    function assertDataShape(nextData) {
      if (!nextData || !Array.isArray(nextData.categories)) {
        throw new Error("JSON 必须包含 categories 数组");
      }
      nextData.categories.forEach((cat, ci) => {
        if (!cat || typeof cat !== "object") throw new Error(`第 ${ci + 1} 个分类格式不正确`);
        if (!Array.isArray(cat.tools)) throw new Error(`分类 ${cat.name || ci + 1} 缺少 tools 数组`);
      });
    }

    async function loadData() {
      const res = await fetch("/data/tools.json", { cache: "no-store" });
      data = await res.json();
      assertDataShape(data);
      render();
    }

    function render() {
      if (!data.categories.length) activeCategory = 0;
      if (activeCategory >= data.categories.length) activeCategory = Math.max(0, data.categories.length - 1);
      $("categoryList").innerHTML = data.categories.map((cat, i) => `
        <button class="cat ${i === activeCategory ? "active" : ""}" type="button" onclick="activeCategory=${i};render()">
          <span>${escapeHtml(cat.icon || "")} ${escapeHtml(cat.name || "")}</span><span>${cat.tools?.length || 0}</span>
        </button>
      `).join("");
      const cat = data.categories[activeCategory];
      $("categoryTitle").textContent = cat ? `${cat.icon || ""} ${cat.name}` : "无分类";
      const query = toolSearch.toLowerCase().trim();
      const tools = cat ? cat.tools.map((tool, i) => ({ tool, i })).filter(({ tool }) => {
        if (!query) return true;
        return [tool.name, tool.desc, tool.q, tool.url, tool.price, tool.audience, ...(tool.tags || []), ...(tool.filters || [])]
          .join(" ")
          .toLowerCase()
          .includes(query);
      }) : [];
      $("categoryMeta").textContent = cat ? `${cat.tools.length} 个工具${query ? `，匹配 ${tools.length} 个` : ""}` : "";
      $("toolCategory").innerHTML = data.categories.map((cat, i) => `<option value="${i}">${escapeHtml(cat.icon || "")} ${escapeHtml(cat.name || "")}</option>`).join("");
      $("toolList").innerHTML = cat && tools.length ? tools.map(({ tool, i }) => `
        <article class="tool">
          <div>
            <h3>${escapeHtml(tool.name)}</h3>
            <p>${escapeHtml(tool.desc || "")}</p>
            <div class="tags">
              ${(tool.price ? [tool.price] : []).concat(tool.audience ? [tool.audience] : [], tool.filters || [], tool.tags || []).slice(0, 8).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
            </div>
          </div>
          <div><button type="button" onclick="openTool(${i})">编辑</button></div>
        </article>
      `).join("") : `<div class="empty">${cat ? "没有匹配的工具" : "还没有分类"}</div>`;
      renderValidation();
    }

    function validateData() {
      const issues = [];
      const names = new Map();
      const total = data.categories.reduce((sum, cat) => sum + (cat.tools?.length || 0), 0);
      data.categories.forEach((cat, ci) => {
        if (!cat.name?.trim()) issues.push(`第 ${ci + 1} 个分类缺少名称`);
        (cat.tools || []).forEach((tool, ti) => {
          const label = tool.name || `${cat.name || "未命名分类"} 第 ${ti + 1} 个工具`;
          if (!tool.name?.trim()) issues.push(`${label} 缺少名称`);
          if (!tool.desc?.trim()) issues.push(`${label} 缺少描述`);
          if (!tool.url?.trim()) issues.push(`${label} 缺少官网链接`);
          if (!tool.q?.trim()) issues.push(`${label} 缺少提问语句`);
          const key = String(tool.name || "").trim().toLowerCase();
          if (key) {
            if (names.has(key)) issues.push(`${tool.name} 与 ${names.get(key)} 重名`);
            else names.set(key, tool.name);
          }
        });
      });
      return { issues, total };
    }

    function renderValidation(forceOpen) {
      const box = $("validationBox");
      const result = validateData();
      box.className = "validation " + (result.issues.length ? "warn" : "ok");
      if (!result.issues.length) {
        box.innerHTML = `<strong>数据正常</strong><br>${data.categories.length} 个分类，${result.total} 个工具。`;
        return;
      }
      const shown = result.issues.slice(0, forceOpen ? result.issues.length : 5);
      const more = result.issues.length > shown.length ? `<div>还有 ${result.issues.length - shown.length} 项，点击“校验数据”查看。</div>` : "";
      box.innerHTML = `<strong>发现 ${result.issues.length} 个维护项</strong><ul>${shown.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>${more}`;
    }

    function switchAdminView(view) {
      const isDashboard = view === "dashboard";
      $("toolsView").hidden = isDashboard;
      $("dashboardView").hidden = !isDashboard;
      $("toolsTab").classList.toggle("active", !isDashboard);
      $("dashboardTab").classList.toggle("active", isDashboard);
      $("toolsTab").setAttribute("aria-selected", String(!isDashboard));
      $("dashboardTab").setAttribute("aria-selected", String(isDashboard));
      if (isDashboard && !statsData) {
        $("adminToken").value = sessionStorage.getItem("admin_stats_token") || "";
      }
    }

    async function loadStats() {
      const token = $("adminToken").value.trim();
      if (!token) return alert("请输入 ADMIN_TOKEN");
      sessionStorage.setItem("admin_stats_token", token);
      $("loadStatsBtn").disabled = true;
      $("loadStatsBtn").textContent = "加载中...";
      try {
        const res = await fetch("/api/admin/stats", { headers: { Authorization: "Bearer " + token }, cache: "no-store" });
        if (!res.ok) throw new Error(res.status === 401 ? "Token 不正确" : "加载失败：" + res.status);
        statsData = await res.json();
        renderStatsDashboard(statsData);
      } catch (error) {
        alert(error.message);
      } finally {
        $("loadStatsBtn").disabled = false;
        $("loadStatsBtn").textContent = "加载数据";
      }
    }

    function clearStatsToken() {
      sessionStorage.removeItem("admin_stats_token");
      $("adminToken").value = "";
      statsData = null;
      renderStatsDashboard(null);
    }

    function renderStatsDashboard(stats) {
      const totals = stats?.totals || {};
      const statItems = [
        ["用户数", totals.users || 0],
        ["收藏数", totals.favorites || 0],
        ["推荐提交", totals.recommendations || 0],
        ["事件数", totals.events || 0]
      ];
      $("statGrid").innerHTML = statItems.map(([label, value]) => `
        <div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${Number(value || 0)}</div></div>
      `).join("");
      renderRankList("eventTypeList", stats?.eventTypes, item => item.type);
      renderRankList("searchTermList", stats?.searchTerms, item => item.keyword);
      renderRankList("favoriteToolList", stats?.favoriteTools, item => item.name || item.slug);
      renderRankList("toolClickList", stats?.toolClicks, item => item.name || item.slug);
      renderRankList("askToolList", stats?.askTools, item => item.name || item.slug);
      renderRankList("officialClickList", stats?.officialClicks, item => item.name || item.slug);
      renderFunnel(stats?.funnel);
      renderRecentEvents(stats?.recentEvents);
    }

    function renderFunnel(items) {
      const list = items || [];
      const max = Math.max(...list.map(item => Number(item.count || 0)), 1);
      $("funnelList").innerHTML = list.length ? list.map((item) => {
        const count = Number(item.count || 0);
        const previous = Number(item.previous || 0);
        const width = Math.max(2, Math.round(count / max * 100));
        const rate = previous > 0 ? Math.round(count / previous * 100) + "%" : "基准";
        const note = item.note ? `<div class="funnel-note">${escapeHtml(item.note)}</div>` : "";
        return `
          <div class="funnel-row">
            <div><div class="funnel-label">${escapeHtml(item.label)}</div>${note}</div>
            <div class="funnel-bar" aria-label="${escapeHtml(item.label)} ${count}"><div class="funnel-fill" style="width:${width}%"></div></div>
            <div class="funnel-value">${count}</div>
            <div class="funnel-rate">${rate}</div>
          </div>
        `;
      }).join("") + `<div class="funnel-note">按事件数粗略观察，不代表独立用户归因。</div>` : `<div class="empty">暂无数据</div>`;
    }

    function renderRankList(id, items, labelFn) {
      const list = items || [];
      $(id).innerHTML = list.length ? list.map((item, index) => `
        <div class="rank-row"><span>${index + 1}</span><span class="rank-name">${escapeHtml(labelFn(item) || "(空)")}</span><span class="rank-count">${Number(item.count || 0)}</span></div>
      `).join("") : `<div class="empty">暂无数据</div>`;
    }

    function renderRecentEvents(items) {
      const list = items || [];
      $("recentEventList").innerHTML = list.length ? list.map((item, index) => `
        <div class="rank-row"><span>${index + 1}</span><span class="rank-name">${escapeHtml(item.type || "")}${item.name ? " · " + escapeHtml(item.name) : ""}</span><span class="rank-count">${escapeHtml(item.created_at || "")}</span></div>
      `).join("") : `<div class="empty">暂无数据</div>`;
    }

    function openTool(index) {
      editingTool = index;
      const cat = data.categories[activeCategory];
      const tool = index == null ? { name:"", q:"", desc:"", tags:[], filters:[], url:"", price:"", audience:"" } : cat.tools[index];
      $("toolDialogTitle").textContent = index == null ? "新增工具" : "编辑工具";
      $("toolName").value = tool.name || "";
      $("toolCategory").value = activeCategory;
      $("toolQuestion").value = tool.q || "";
      $("toolDesc").value = tool.desc || "";
      $("toolUrl").value = tool.url || "";
      $("toolPrice").value = tool.price || "";
      $("toolAudience").value = tool.audience || "";
      $("toolTags").value = (tool.tags || []).join(",");
      $("toolFilters").value = (tool.filters || []).join(",");
      $("deleteToolBtn").style.display = index == null ? "none" : "";
      $("toolDialog").showModal();
    }

    function saveTool() {
      const targetCategory = Number($("toolCategory").value);
      if (!data.categories[targetCategory]) return alert("请先新增分类");
      const tool = {
        name: $("toolName").value.trim(),
        q: $("toolQuestion").value.trim(),
        desc: $("toolDesc").value.trim(),
        tags: splitList($("toolTags").value),
        filters: splitList($("toolFilters").value),
        url: $("toolUrl").value.trim(),
        price: $("toolPrice").value.trim(),
        audience: $("toolAudience").value.trim()
      };
      if (!tool.name) return alert("名称不能为空");
      if (!tool.q) tool.q = tool.name + "怎么用";
      if (editingTool == null) {
        data.categories[targetCategory].tools.push(tool);
      } else {
        const old = data.categories[activeCategory].tools.splice(editingTool, 1)[0];
        data.categories[targetCategory].tools.push({ ...old, ...tool });
        activeCategory = targetCategory;
      }
      $("toolDialog").close();
      toolSearch = "";
      $("toolSearch").value = "";
      render();
    }

    function deleteTool() {
      if (editingTool == null) return;
      if (!confirm("确认删除这个工具？")) return;
      data.categories[activeCategory].tools.splice(editingTool, 1);
      $("toolDialog").close();
      render();
    }

    function openCategory(index) {
      editingCategory = index;
      const cat = index == null ? { icon:"", name:"", bg:"rgba(59,130,246,0.13)", tools:[] } : data.categories[index];
      $("catIcon").value = cat.icon || "";
      $("catName").value = cat.name || "";
      $("catBg").value = cat.bg || "";
      $("deleteCategoryBtn").style.display = index == null ? "none" : "";
      $("categoryDialog").showModal();
    }

    function saveCategory() {
      const cat = {
        icon: $("catIcon").value.trim(),
        name: $("catName").value.trim(),
        bg: $("catBg").value.trim(),
        tools: editingCategory == null ? [] : data.categories[editingCategory].tools
      };
      if (!cat.name) return alert("分类名称不能为空");
      if (editingCategory == null) {
        data.categories.push(cat);
        activeCategory = data.categories.length - 1;
      } else {
        data.categories[editingCategory] = cat;
        activeCategory = editingCategory;
      }
      $("categoryDialog").close();
      render();
    }

    function deleteCategory() {
      if (editingCategory == null) return;
      if (!confirm("确认删除分类及其中所有工具？")) return;
      data.categories.splice(editingCategory, 1);
      activeCategory = 0;
      $("categoryDialog").close();
      render();
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "tools.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    $("addToolBtn").onclick = () => openTool(null);
    $("toolSearch").oninput = (event) => { toolSearch = event.target.value; render(); };
    $("validateBtn").onclick = () => renderValidation(true);
    $("saveToolBtn").onclick = saveTool;
    $("deleteToolBtn").onclick = deleteTool;
    $("addCategoryBtn").onclick = () => openCategory(null);
    $("saveCategoryBtn").onclick = saveCategory;
    $("deleteCategoryBtn").onclick = deleteCategory;
    $("exportBtn").onclick = exportJson;
    $("importBtn").onclick = () => $("fileInput").click();
    $("loadStatsBtn").onclick = loadStats;
    $("clearStatsTokenBtn").onclick = clearStatsToken;
    $("fileInput").onchange = async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const nextData = JSON.parse(await file.text());
        assertDataShape(nextData);
        data = nextData;
        activeCategory = 0;
        toolSearch = "";
        $("toolSearch").value = "";
        render();
      } catch (error) {
        alert("导入失败：" + error.message);
      } finally {
        event.target.value = "";
      }
    };

    loadData().catch(error => {
      document.body.innerHTML = "<pre>加载工具数据失败：" + error.message + "</pre>";
    });
  </script>
</body>
</html>
